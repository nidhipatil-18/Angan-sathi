<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Child - Angan Sathi</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f6f7fb;
    color: #1f2937;
}

.topbar {
    height: 78px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: #7c3aed;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
}

.brand h1 {
    font-size: 21px;
    color: #111827;
    margin-bottom: 3px;
}

.brand p {
    font-size: 12px;
    color: #6b7280;
}

.back-btn {
    padding: 10px 18px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 8px;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.back-btn:hover {
    background: #f9fafb;
}

.container {
    max-width: 1050px;
    margin: 42px auto;
    padding: 0 24px;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h2 {
    font-size: 28px;
    color: #111827;
    margin-bottom: 7px;
}

.page-title p {
    color: #6b7280;
    font-size: 14px;
}

.form-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 5px 20px rgba(15, 23, 42, 0.05);
}

.form-header {
    padding-bottom: 24px;
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 27px;
}

.form-header h3 {
    font-size: 20px;
    color: #111827;
    margin-bottom: 6px;
}

.form-header p {
    font-size: 14px;
    color: #6b7280;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 23px 26px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

label {
    font-size: 13px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    height: 45px;
    padding: 0 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
    color: #111827;
    font-size: 14px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
}

input::placeholder {
    color: #9ca3af;
}

.form-help {
    margin-top: 6px;
    color: #9ca3af;
    font-size: 12px;
}

.info-box {
    margin-top: 27px;
    padding: 14px 16px;
    border-radius: 8px;
    background: #f5f3ff;
    border: 1px solid #ddd6fe;
    color: #5b21b6;
    font-size: 13px;
    line-height: 1.5;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px solid #e5e7eb;
}

.cancel-btn,
.save-btn {
    height: 44px;
    padding: 0 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.cancel-btn {
    background: white;
    border: 1px solid #d1d5db;
    color: #374151;
}

.cancel-btn:hover {
    background: #f9fafb;
}

.save-btn {
    background: #7c3aed;
    border: 1px solid #7c3aed;
    color: white;
}

.save-btn:hover {
    background: #6d28d9;
}

@media (max-width: 700px) {
    .topbar {
        padding: 0 20px;
    }

    .brand h1 {
        font-size: 18px;
    }

    .container {
        margin: 25px auto;
        padding: 0 15px;
    }

    .form-card {
        padding: 22px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .form-actions {
        flex-direction: column-reverse;
    }

    .cancel-btn,
    .save-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            AS
        </div>

        <div>
            <h1>Angan Sathi</h1>
            <p>Child Record & Growth Management</p>
        </div>

    </div>

    <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
    >
        ← Back to Dashboard
    </button>

</header>


<main class="container">

    <div class="page-title">

        <h2>Edit Child</h2>

        <p>
            Update the child's information
        </p>

    </div>


    <div class="form-card">

        <div class="form-header">

            <h3>Child Information</h3>

            <p>
                Update the available information.
                You can complete missing details later.
            </p>

        </div>


        <form id="editChildForm">

            <div class="form-grid">

                <div class="form-group">

                    <label for="editChildName">
                        Child Name
                    </label>

                    <input
                        type="text"
                        id="editChildName"
                        placeholder="Enter child's name"
                    >

                </div>


                <div class="form-group">

                    <label for="editDob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="editDob"
                    >

                </div>


                <div class="form-group">

                    <label for="editGender">
                        Gender
                    </label>

                    <select id="editGender">

                        <option value="Boy">
                            Boy
                        </option>

                        <option value="Girl">
                            Girl
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="editParentName">
                        Parent / Guardian Name
                    </label>

                    <input
                        type="text"
                        id="editParentName"
                        placeholder="Enter parent or guardian name"
                    >

                </div>


                <div class="form-group">

                    <label for="editContact">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="editContact"
                        placeholder="Enter contact number"
                    >

                </div>


                <div class="form-group">

                    <label for="editHeight">
                        Height
                    </label>

                    <input
                        type="number"
                        id="editHeight"
                        min="0"
                        step="0.01"
                        placeholder="Height in cm"
                    >

                    <span class="form-help">
                        Measured in centimetres (cm)
                    </span>

                </div>


                <div class="form-group">

                    <label for="editWeight">
                        Weight
                    </label>

                    <input
                        type="number"
                        id="editWeight"
                        min="0"
                        step="0.01"
                        placeholder="Weight in kg"
                    >

                    <span class="form-help">
                        Measured in kilograms (kg)
                    </span>

                </div>

            </div>


            <div class="info-box">

                Changes will be saved to the child's
                existing record.

            </div>


            <div class="actions">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelEditBtn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
