<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archived Children - Angan Sathi</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f6f7fb;
    color: #1f2937;
}

.topbar {
    min-height: 78px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: #7c3aed;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
}

.brand h1 {
    font-size: 21px;
    color: #111827;
    margin-bottom: 3px;
}

.brand p {
    font-size: 12px;
    color: #6b7280;
}

.back-btn {
    padding: 10px 18px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 8px;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.back-btn:hover {
    background: #f9fafb;
}

.container {
    max-width: 1150px;
    margin: 40px auto;
    padding: 0 24px;
}

.page-heading {
    margin-bottom: 25px;
}

.page-heading h2 {
    font-size: 28px;
    color: #111827;
    margin-bottom: 7px;
}

.page-heading p {
    font-size: 14px;
    color: #6b7280;
}

.card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
}

.card-title h3 {
    font-size: 20px;
    color: #111827;
    margin-bottom: 6px;
}

.card-title p {
    font-size: 13px;
    color: #6b7280;
}

.search-box {
    width: 270px;
    height: 42px;
    padding: 0 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    font-size: 13px;
}

.search-box:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
}

.table-wrapper {
    overflow-x: auto;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
}

thead {
    background: #f9fafb;
}

th {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
    color: #6b7280;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
}

td {
    padding: 15px 16px;
    border-bottom: 1px solid #f0f0f0;
    color: #374151;
    font-size: 13px;
}

tbody tr:hover {
    background: #fafafa;
}

.child-name {
    font-weight: 700;
    color: #111827;
}

.status {
    display: inline-flex;
    padding: 5px 10px;
    border-radius: 20px;
    background: #f3f4f6;
    color: #4b5563;
    font-size: 11px;
    font-weight: 700;
}

.view-btn {
    height: 33px;
    padding: 0 12px;
    border-radius: 7px;
    border: 1px solid #ddd6fe;
    background: #f5f3ff;
    color: #6d28d9;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

.view-btn:hover {
    background: #ede9fe;
}

.empty-state {
    text-align: center;
    padding: 45px 20px;
    color: #9ca3af;
    font-size: 14px;
}

@media (max-width: 700px) {
    .topbar {
        padding: 0 20px;
    }

    .container {
        margin: 25px auto;
        padding: 0 15px;
    }

    .card {
        padding: 20px;
    }

    .card-header {
        flex-direction: column;
    }

    .search-box {
        width: 100%;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">AS</div>

        <div>
            <h1>Angan Sathi</h1>
            <p>Child Record & Growth Management</p>
        </div>

    </div>

    <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
    >
        ← Back to Dashboard
    </button>

</header>

<main class="container">

    <div class="page-heading">
        <h2>Archived Children</h2>
        <p>Records of children who have completed 6 years</p>
    </div>

    <section class="card">

        <div class="card-header">

            <div class="card-title">
                <h3>Archived Records</h3>
                <p>View children who are no longer in active records.</p>
            </div>

            <input
                type="text"
                id="archivedSearch"
                class="search-box"
                placeholder="Search child by name"
            >

        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Date of Birth</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Parent / Guardian</th>
                        <th>Contact</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="archivedChildrenTable">

                    <tr>
                        <td colspan="8" class="empty-state">
                            Loading archived children...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
